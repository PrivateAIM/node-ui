name: Build and push Docker images

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - develop

permissions:
  contents: read # for checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump:
    name: "Bump version"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bumpv.outputs.newTag }}
    permissions:
      contents: write # for checkout
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name:  Automated Version Bump
        id: bumpv
        uses:  phips28/gh-action-bump-version@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          major-wording: 'BREAKING CHANGE'
          minor-wording: 'minor'
          target-branch: 'develop'

#      - name: Install deps
#        run: pnpm i
#
#      - name: Build pkg
#        run: pnpm run build
#
#      - name: Release
#        uses: softprops/action-gh-release@v2

  build-prod-image:
    name: Build and push production Docker image
    needs: bump  # Wait until pkg bumped
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout  # required for finding action
        uses: actions/checkout@v4

      - name: Build production image
        uses: ./.github/actions/build-docker-image
        with:
          platforms: linux/amd64
          docker_file: prod.Dockerfile
          image_tags: ${{ needs.bump.outputs.version }}
          push: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

  build-canary-image:
    name: Build and push canary image
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout  # required for finding action
        uses: actions/checkout@v4

      - name: Build canary image
        uses: ./.github/actions/build-docker-image
        with:
          platforms: linux/amd64
          docker_file: Dockerfile
          push: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
