name: Create and publish Docker image

env:
  PACKAGE: ghcr.io/${{ github.repository }}

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PACKAGE }}
          tags: |
            type=sha
            type=semver,pattern={{version}}

      - name: get-npm-version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

  build-prod-image:
    if: ${{ github.event.pull_request.merged }}
    uses: ./.github/workflows/build-docker-image.yaml
    needs: [metadata]
    with:
      platforms: linux/amd64
      docker_file: prod.Dockerfile
      image_tags: |
        ${{ needs.metadata.outputs.tags }}
        ${{ env.PACKAGE }}:prod
        ${{ env.PACKAGE }}:latest
      image_labels: ${{ needs.metadata.outputs.labels }}
      push: true

  build-canary-image:
    if: ${{ contains(github.event.head_commit.message, 'build_image') }}
    uses: ./.github/workflows/build-docker-image.yaml
    needs: [metadata]
    with:
      platforms: linux/amd64
      docker_file: Dockerfile
      image_tags: |
        ${{ needs.metadata.outputs.tags }}
        ${{ env.PACKAGE }}:canary
      image_labels: ${{ needs.metadata.outputs.labels }}
      push: true

  build-edge-image:
    uses: ./.github/workflows/build-docker-image.yaml
    needs: [metadata]
    with:
      platforms: linux/amd64
      docker_file: Dockerfile
      image_tags: |
        ${{ needs.metadata.outputs.tags }}
        ${{ env.PACKAGE }}:edge
        ${{ env.PACKAGE }}:${{ needs.metadata.outputs.current-version }}
      image_labels: ${{ needs.metadata.outputs.labels }}
      push: true
