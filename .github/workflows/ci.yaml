name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read # for checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: 'Build & Test'
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Harden Runner
        uses: step-security/harden-runner@v2.19.4
        with:
          disable-sudo: true
          egress-policy: audit

      - uses: ./.github/actions/setup-and-cache
        with:
          node-version: 24

      - uses: browser-actions/setup-chrome@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:ci

  preview-image:
    name: 'Build preview image'
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout  # required for finding action
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Pull requests from forks get a read-only token, so they can only verify
      # that the image still compiles - they cannot publish a preview image.
      - name: Build preview image
        uses: ./.github/actions/build-docker-image
        with:
          platforms: linux/amd64
          docker_file: prod.Dockerfile
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          extra_tag: pr-${{ github.event.number }}
