name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read # for checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    runs-on: ubuntu-latest
    name: 'Check differences'
    outputs:
      should_skip: ${{ steps.changed-files.outputs.only_changed == 'true' }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@a284dc1814e3fd07f2e34267fc8f81227ed29fb8 # v45.0.9
        with:
          files: |
            docs/**
            .github/**
            !.github/workflows/ci.yml
            **.md

  run-tests:
    needs: changed
    name: 'Build & Test'
    # if: needs.changed.outputs.should_skip != 'true'
    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        node_version: [ 24 ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Harden Runner
        uses: step-security/harden-runner@v2.19.4
        with:
          disable-sudo: true
          egress-policy: audit

      - uses: ./.github/actions/setup-and-cache
        with:
          node-version: ${{ matrix.node_version }}

      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3

      - name: Install pnpm
        run: pnpm i

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:ci

  test-image-compilation:
    name: "Test production image compilation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout  # required for finding action
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-docker-image
        with:
          platforms: linux/amd64
          docker_file: prod.Dockerfile
          push: 'false'
          token: ${{ secrets.GITHUB_TOKEN }}
