name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read # for checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-bump:
    name: "test bumping"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Get current branch name
        id: get_branch
        run: echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV

      - name: ⏫ Bumping version
        id: bump-version
        uses: jpb06/bump-package@latest
        with:
          major-keywords: BREAKING CHANGE
          minor-keywords: minor
          patch-keywords: fix,chore,feat
          should-default-to-patch: true
          debug: false

  changed:
    runs-on: ubuntu-latest
    name: 'Check differences'
    outputs:
      should_skip: ${{ steps.changed-files.outputs.only_changed == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@a284dc1814e3fd07f2e34267fc8f81227ed29fb8 # v45.0.9
        with:
          files: |
            docs/**
            .github/**
            !.github/workflows/ci.yml
            **.md

  run-tests:
    needs: changed
    name: 'Build & Test: node-${{ matrix.node_version }}, ${{ matrix.os }}'
    # if: needs.changed.outputs.should_skip != 'true'
    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [18, 20, 22]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-and-cache
        with:
          node-version: ${{ matrix.node_version }}

      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3

      - name: Install pnpm
        run: pnpm i

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:ci

  test-image-build:
    name: "Test production image compilation"
    runs-on: ubuntu-latest
    steps:
    - uses: ./.github/workflows/build-docker-image.yaml
      with:
        platforms: linux/amd64
        docker_file: prod.Dockerfile
        push: false